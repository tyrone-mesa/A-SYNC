name: Fix lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate both lockfiles
        run: |
          rm -f server/client-package-lock.json
          cd server && npm install && cd ..
          cd client && npm install && cd ..

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to change" || git commit -m "fix: regenerate package-lock.json files to sync with package.json"
          git push

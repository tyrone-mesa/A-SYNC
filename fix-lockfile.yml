name: Fix client lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate client package-lock.json
        run: |
          cd client
          rm -f package-lock.json
          npm install

      - name: Commit and push updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          git diff --cached --quiet && echo "Lockfile already in sync" || git commit -m "fix(client): regenerate package-lock.json to sync with package.json"
          git push
